<!DOCTYPE html>
<html>
    <head>
        <title>Rube Goldberg Machine</title>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.x/dist/aframe-physics-system.min.js"></script>
    </head>
    <body>
        <a-scene physics="gravity: -9.8; debug: false">

            <a-sky color="lightblue"></a-sky>

            <!-- Camera (Centered at 0, 1.6, 0) -->
            <a-entity camera look-controls
                wasd-controls
                position="0 1.6 -2"
                constraint="collideConnected:true"
                static-body
            ></a-entity>

            <!-- Floor -->
            <a-plane static-body
                color="tan"
                position="0 0 0"
                width="30"
                height="30"
                rotation="-90 0 0"
            ></a-plane>


            <!-- PIECE 1: RED STARTER SPHERE & RAMP 1-->


            <!-- Red Sphere -->
            <a-sphere dynamic-body="mass: 2"
                position="-4.4 5.6 -5.0"
                radius="0.4"
                color="red"
            ></a-sphere>

            <!-- Ramp 1 Track -->
            <a-box static-body
                position="-3.5 4.15 -5.0"
                width="3.1"
                height="0.15"
                depth="1.0"
                rotation="0 0 -33"
                color="saddlebrown"
            ></a-box>

            <!-- Ramp 1 Front Guard Rail -->
            <a-box static-body
                position="-3.5 4.3 -4.55"
                width="3.1"
                height="0.3"
                depth="0.1"
                rotation="0 0 -33"
                color="maroon"
            ></a-box>

            <!-- Ramp 1 Back Guard Rail -->
            <a-box static-body
                position="-3.5 4.3 -5.45"
                width="3.1"
                height="0.3"
                depth="0.1"
                rotation="0 0 -33"
                color="maroon"
            ></a-box>


           
            <!-- PIECE 2: DOMINO CHAIN REACTION -->

            <!-- Domino Platform -->
            <a-box static-body
                position="-0.9 3.1 -5.0"
                width="2.4"
                height="0.2"
                depth="1.0"
                color="saddlebrown"
            ></a-box>

            <!-- Domino 1 (Hit by Red Sphere) -->
            <a-box dynamic-body="mass: 0.5"
                position="-1.8 3.7 -5.0"
                width="0.15"
                height="0.9"
                depth="0.4"
                color="yellow"
            ></a-box>

            <!-- Domino 2 -->
            <a-box dynamic-body="mass: 0.5"
                position="-1.3 3.7 -5.0"
                width="0.15"
                height="0.9"
                depth="0.4"
                color="orange"
            ></a-box>

            <!-- Domino 3 -->
            <a-box dynamic-body="mass: 0.5"
                position="-0.8 3.7 -5.0"
                width="0.15"
                height="0.9"
                depth="0.4"
                color="crimson"
            ></a-box>

            <!-- Domino 4 (Knocks Blue Sphere) -->
            <a-box dynamic-body="mass: 0.5"
                position="-0.3 3.7 -5.0"
                width="0.15"
                height="0.9"
                depth="0.4"
                color="purple"
            ></a-box>


            <!-- PIECE 3: BLUE SPHERE & RAMP 2             -->

            <!-- Blue Sphere  -->
            <a-sphere dynamic-body="mass: 1.5"
                position="0.2 3.55 -5.0"
                radius="0.35"
                color="blue"
            ></a-sphere>

            <!-- Ramp 2 Track -->
            <a-box static-body
                position="1.9 2.35 -5.0"
                width="3.6"
                height="0.15"
                depth="1.0"
                rotation="0 0 -28"
                color="indigo"
            ></a-box>

            <!-- Ramp 2 Front Guard Rail -->
            <a-box static-body
                position="1.9 2.5 -4.55"
                width="3.6"
                height="0.3"
                depth="0.1"
                rotation="0 0 -28"
                color="darkblue"
            ></a-box>

            <!-- Ramp 2 Back Guard Rail -->
            <a-box static-body
                position="1.9 2.5 -5.45"
                width="3.6"
                height="0.3"
                depth="0.1"
                rotation="0 0 -28"
                color="darkblue"
            ></a-box>


            <!-- PIECE 4    -->

            <!-- Platform 2 Base -->
            <a-box static-body
                position="4.3 1.2 -5.0"
                width="1.6"
                height="0.2"
                depth="1.0"
                color="gold"
            ></a-box>

            <!-- Standing Yellow Piece -->
            <a-box dynamic-body="mass: 0.5"
                position="3.7 1.8 -5.0"
                width="0.15"
                height="0.8"
                depth="0.4"
                color="yellow"
            ></a-box>

            <!-- Green Sphere-->
            <a-sphere dynamic-body="mass: 1.2"
                position="4.3 1.65 -5.0"
                radius="0.35"
                color="limegreen"
            ></a-sphere>


            <!-- PIECE 5: RAMP & CONTAINER      -->

            <!-- Ramp 3 Track Assembly -->
            <a-entity position="3.5 0.9 -3.7" rotation="0 -135 -12">
                <!-- Track Floor -->
                <a-box static-body
                    position="0 0 0"
                    width="3.8"
                    height="0.15"
                    depth="1.0"
                    color="darkcyan"
                ></a-box>
                <!-- Left Guard Rail -->
                <a-box static-body
                    position="0 0.15 -0.55"
                    width="3.8"
                    height="0.3"
                    depth="0.1"
                    color="teal"
                ></a-box>
                <!-- Right Guard Rail -->
                <a-box static-body
                    position="0 0.15 0.55"
                    width="3.8"
                    height="0.3"
                    depth="0.1"
                    color="teal"
                ></a-box>
            </a-entity>

            <!-- Target Catch Container Base -->
            <a-box static-body
                position="1.2 0.1 -1.4"
                width="2.2"
                height="0.2"
                depth="2.2"
                color="darkred"
            ></a-box>

            <!-- Container Back Wall -->
            <a-box static-body
                position="1.2 0.6 -0.3"
                width="2.2"
                height="1.0"
                depth="0.1"
                color="darkred"
            ></a-box>

            <!-- Container Front Wall -->
            <a-box static-body
                position="1.2 0.6 -2.5"
                width="2.2"
                height=".3"
                depth="0.1"
                color="darkred"
            ></a-box>

            <!-- Container Side Wall Left -->
            <a-box static-body
                position="0.1 0.6 -1.4"
                width="0.1"
                height="1.0"
                depth="2.2"
                color="darkred"
            ></a-box>

            <!-- Container Side Wall Right -->
            <a-box static-body
                position="2.3 0.6 -1.4"
                width="0.1"
                height=".3"
                depth="2.2"
                color="darkred"
            ></a-box>

        </a-scene>
    </body>
</html>
